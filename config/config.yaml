# ─────────────────────────────────────────────────────────────────
#  NeuralSentinel-IDS · Configuration
# ─────────────────────────────────────────────────────────────────

data:
  dir: "data"
  binary: true          # true = normal vs attack | false = multi-class
  val_size: 0.15
  random_state: 42

ids:
  hidden_dims: [256, 128, 64, 32]
  dropout: 0.3
  neural_weight: 0.5    # weight in ensemble (RF + GB share remaining 0.5)

gan:
  latent_dim: 64
  generator_dims: [128, 256, 128]
  use_attention: true
  lr_g: 0.0001
  lr_d: 0.0001
  epochs: 30            # CPU için hızlı (eskiden 100)
  batch_size: 512       # Daha büyük batch = daha hızlı
  n_critic: 2           # Eskiden 5, çok yavaşlatıyordu
  lambda_gp: 10.0

training:
  checkpoint_dir: "checkpoints"
  harden_epochs: 10     # Eskiden 30
  batch_size: 512
  n_adversarial: 2000   # Eskiden 5000

dashboard:
  state_file: "data/dashboard_state.json"
  host: "0.0.0.0"
  port: 8050
  update_interval_ms: 3000

logging:
  level: "INFO"
  log_dir: "logs"
