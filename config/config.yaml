# ─────────────────────────────────────────────────────────────────
#  NeuralSentinel-IDS · Configuration
# ─────────────────────────────────────────────────────────────────

data:
  dir: "data"
  binary: true          # true = normal vs attack | false = multi-class
  val_size: 0.15
  random_state: 42

ids:
  hidden_dims: [256, 128, 64, 32]
  dropout: 0.3
  neural_weight: 0.5    # weight in ensemble (RF + GB share remaining 0.5)

gan:
  latent_dim: 64
  generator_dims: [128, 256, 256, 128]
  use_attention: true
  lr_g: 0.0001
  lr_d: 0.0001
  epochs: 100
  batch_size: 256
  n_critic: 5           # Discriminator updates per Generator update
  lambda_gp: 10.0       # Gradient penalty coefficient

training:
  checkpoint_dir: "checkpoints"
  harden_epochs: 30
  batch_size: 256
  n_adversarial: 5000   # Fake samples injected during hardening

dashboard:
  state_file: "data/dashboard_state.json"
  host: "0.0.0.0"
  port: 8050
  update_interval_ms: 3000

logging:
  level: "INFO"
  log_dir: "logs"
