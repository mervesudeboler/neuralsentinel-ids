# ─────────────────────────────────────────────────────────────────
#  NeuralSentinel-IDS · Configuration
# ─────────────────────────────────────────────────────────────────

data:
  dir: "data"
  binary: true          # true = normal vs attack | false = multi-class
  val_size: 0.15
  random_state: 42

ids:
  hidden_dims: [256, 128, 64, 32]
  dropout: 0.3
  neural_weight: 0.5    # weight in ensemble (RF + GB share remaining 0.5)

gan:
  latent_dim: 64
  generator_dims: [128, 256, 128]
  use_attention: true
  lr_g: 0.00005          # daha yavaş generator → discriminator ayak uydurur
  lr_d: 0.0004
  epochs: 20
  batch_size: 512
  n_critic: 4            # 2→4: discriminator daha güçlü kalır
  lambda_gp: 10.0

training:
  checkpoint_dir: "checkpoints"
  pretrain_epochs: 30    # IDS önce güçlü classifier olarak eğitilir
  pretrain_lr: 0.001
  harden_epochs: 30      # daha güçlü hardening
  batch_size: 256
  n_adversarial: 8000    # çok daha fazla adversarial örnek

dashboard:
  state_file: "data/dashboard_state.json"
  host: "0.0.0.0"
  port: 8050
  update_interval_ms: 3000

logging:
  level: "INFO"
  log_dir: "logs"
